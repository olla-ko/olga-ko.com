<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Блог Ольги Коноваловой</title>
<meta name="description" content="Моя жизнь в словах и картинках">
<link rel="icon" href="favicon.ico">
<link rel="preload" href="fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="tailwind.css">
<link rel="stylesheet" href="style.css?v=tw6">
<script>
// до отрисовки, чтобы не мигала тема: .dark по выбору или системной настройке
(function () {
  const saved = localStorage.getItem("theme");
  const dark = saved ? saved === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.classList.toggle("dark", dark);
})();
</script>
</head>
<body class="font-sans bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 text-[17px] leading-[1.65] max-[480px]:text-base">

<header class="site-header relative max-w-content mx-auto px-5 pt-10 pb-[18px]">
  <button class="theme-toggle absolute top-8 right-5 rounded-full border border-slate-200 dark:border-slate-700 px-3 py-[3px] text-sm text-slate-500 dark:text-slate-400 hover:text-sky-700 dark:hover:text-sky-400 hover:border-sky-700 dark:hover:border-sky-400"
          id="theme-toggle" type="button" aria-label="Переключить тему">◐</button>
  <a class="site-title block text-[34px] max-[480px]:text-[29px] font-semibold leading-[1.04] tracking-[-0.01em] text-slate-800 dark:text-slate-100 pr-[70px] hover:text-sky-700 dark:hover:text-sky-400 hover:no-underline" href="#/">Блог Ольги Коноваловой</a>
  <p class="italic text-lg text-slate-500 dark:text-slate-400 mt-1.5">Моя жизнь в словах и картинках</p>
  <svg class="masthead-rule block w-full h-[9px] mt-4 text-sky-700 dark:text-sky-400" viewBox="0 0 1000 9" preserveAspectRatio="none" aria-hidden="true">
    <path d="M3 5.5 C 110 2 190 8 300 5 S 470 2 560 5.5 S 720 8 820 4.5 S 950 3 997 5.5"/>
  </svg>
</header>

<main id="app" class="max-w-content mx-auto px-5 pt-6 pb-12 min-h-[60vh]">
  <p class="text-slate-500 dark:text-slate-400">Загрузка…</p>
</main>

<footer class="site-footer max-w-read mx-auto px-5 pb-8 text-sm text-slate-500 dark:text-slate-400 border-t border-slate-200 dark:border-slate-700">
  <p class="pt-4">Архив блога · 2010—2025 · <a class="hover:text-sky-700 dark:hover:text-sky-400" href="styleguide.html">гайд стилей</a></p>
</footer>

<script src="app.js?v=tw6"></script>
</body>
</html>
